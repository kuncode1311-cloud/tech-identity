<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1728"/>
      <stop offset="100%" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122235"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Glowing Background Orbs -->
  <circle cx="150" cy="120" r="140" fill="#3B82F6" opacity="0.18" filter="url(#glow)"/>
  <circle cx="680" cy="380" r="160" fill="#22D3EE" opacity="0.15" filter="url(#glow)"/>

  <!-- Browser Window Frame -->
  <g transform="translate(40, 30)">
    <!-- Window Bar -->
    <rect width="720" height="440" rx="16" fill="#122235" stroke="rgba(148, 163, 184, 0.25)" stroke-width="2"/>
    <rect width="720" height="44" rx="16" fill="#0D1B2A"/>
    <rect y="30" width="720" height="14" fill="#0D1B2A"/>
    <line x1="0" y1="44" x2="720" y2="44" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>

    <!-- Window Control Dots -->
    <circle cx="24" cy="22" r="6" fill="#EF4444"/>
    <circle cx="44" cy="22" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="22" r="6" fill="#10B981"/>

    <!-- Address Bar -->
    <rect x="100" y="10" width="320" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="115" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">vietquang.dev/portfolio</text>

    <!-- Navigation Header -->
    <rect x="30" y="64" width="32" height="32" rx="8" fill="#22D3EE"/>
    <text x="38" y="85" font-family="Manrope, sans-serif" font-weight="900" font-size="14" fill="#07111F">VQ</text>
    <text x="72" y="85" font-family="Manrope, sans-serif" font-weight="800" font-size="15" fill="#F8FAFC">Việt Quang</text>

    <rect x="480" y="70" width="60" height="16" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="555" y="70" width="60" height="16" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="630" y="66" width="65" height="24" rx="12" fill="url(#primaryGrad)"/>

    <!-- Left Hero Column -->
    <rect x="30" y="125" width="100" height="22" rx="11" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.4)"/>
    <text x="42" y="140" font-family="sans-serif" font-size="11" font-weight="700" fill="#22D3EE">📍 Về bản thân</text>

    <text x="30" y="185" font-family="Manrope, sans-serif" font-size="26" font-weight="900" fill="#F8FAFC">Trần Vũ Việt Quang</text>
    <text x="30" y="215" font-family="sans-serif" font-size="16" font-weight="700" fill="#22D3EE">Front-end Developer &amp; UI/UX</text>

    <rect x="30" y="235" width="320" height="8" rx="4" fill="#94A3B8" opacity="0.6"/>
    <rect x="30" y="250" width="260" height="8" rx="4" fill="#94A3B8" opacity="0.4"/>

    <rect x="30" y="280" width="110" height="36" rx="10" fill="url(#primaryGrad)"/>
    <text x="50" y="303" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFF">Xem dự án →</text>

    <rect x="150" y="280" width="90" height="36" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)"/>
    <text x="175" y="303" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Liên hệ</text>

    <!-- Right Column: 4 Stat Cards -->
    <g transform="translate(390, 125)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="145" height="95" rx="14" fill="url(#cardGrad)" stroke="rgba(148,163,184,0.2)"/>
      <text x="15" y="32" font-size="20">🚀</text>
      <text x="15" y="65" font-family="Manrope, sans-serif" font-size="24" font-weight="900" fill="#22D3EE">03+</text>
      <text x="15" y="82" font-family="sans-serif" font-size="11" fill="#94A3B8">Dự án học tập</text>

      <!-- Card 2 -->
      <rect x="155" y="0" width="145" height="95" rx="14" fill="url(#cardGrad)" stroke="rgba(148,163,184,0.2)"/>
      <text x="170" y="32" font-size="20">⚡</text>
      <text x="170" y="65" font-family="Manrope, sans-serif" font-size="24" font-weight="900" fill="#22D3EE">08+</text>
      <text x="170" y="82" font-family="sans-serif" font-size="11" fill="#94A3B8">Kỹ năng công nghệ</text>

      <!-- Card 3 -->
      <rect x="0" y="105" width="145" height="95" rx="14" fill="url(#cardGrad)" stroke="rgba(148,163,184,0.2)"/>
      <text x="15" y="137" font-size="20">📅</text>
      <text x="15" y="170" font-family="Manrope, sans-serif" font-size="24" font-weight="900" fill="#22D3EE">01+</text>
      <text x="15" y="187" font-family="sans-serif" font-size="11" fill="#94A3B8">Năm học lập trình</text>

      <!-- Card 4 -->
      <rect x="155" y="105" width="145" height="95" rx="14" fill="url(#cardGrad)" stroke="rgba(148,163,184,0.2)"/>
      <text x="170" y="137" font-size="20">💪</text>
      <text x="170" y="170" font-family="Manrope, sans-serif" font-size="24" font-weight="900" fill="#22D3EE">100%</text>
      <text x="170" y="187" font-family="sans-serif" font-size="11" fill="#94A3B8">Tinh thần học hỏi</text>
    </g>

    <!-- Bottom Skill Progress Bars Preview -->
    <rect x="30" y="340" width="660" height="70" rx="14" fill="#0D1B2A" stroke="rgba(59,130,246,0.3)"/>
    <text x="50" y="365" font-family="Manrope, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC">🌐 HTML5 / CSS3 / JavaScript</text>
    <rect x="50" y="380" width="500" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="50" y="380" width="440" height="8" rx="4" fill="url(#primaryGrad)"/>
    <text x="560" y="388" font-family="sans-serif" font-size="12" font-weight="800" fill="#22D3EE">88%</text>
  </g>
</svg>